<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoTIFF Viewer — загрузка файла</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f0f1a;
      --surface: #1a1a2e;
      --border:  #2a2a4a;
      --accent:  #e94560;
      --text:    #e0e0e0;
      --muted:   #888;
      --error:   #f44336;
      --radius:  12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    header { text-align: center; margin-bottom: 40px; }
    header h1 { font-size: 1.8rem; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
    header p  { color: var(--muted); font-size: 0.95rem; max-width: 500px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      width: 100%;
      max-width: 560px;
    }

    /* Зона перетаскивания */
    #drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 48px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }
    #drop-zone.hover { border-color: var(--accent); background: rgba(233,69,96,0.05); }
    #drop-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    #drop-zone .icon  { font-size: 2.5rem; margin-bottom: 12px; }
    #drop-zone .label { font-size: 1rem; font-weight: 500; margin-bottom: 6px; }
    #drop-zone .hint  { font-size: 0.8rem; color: var(--muted); }

    #file-name { margin-top: 14px; font-size: 0.85rem; color: var(--accent); min-height: 1.2em; text-align: center; }

    /* Кнопка */
    #submit-btn {
      margin-top: 20px; width: 100%; padding: 14px;
      background: var(--accent); color: #fff;
      border: none; border-radius: 8px;
      font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: opacity 0.2s;
    }
    #submit-btn:hover    { opacity: 0.85; }
    #submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Спиннер */
    #spinner { display: none; margin-top: 28px; text-align: center; }
    .spin {
      display: inline-block; width: 40px; height: 40px;
      border: 4px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #spinner p { margin-top: 12px; color: var(--muted); font-size: 0.9rem; }

    /* Ошибка */
    #error-box {
      display: none; margin-top: 20px;
      background: rgba(244,67,54,0.1);
      border: 1px solid rgba(244,67,54,0.4);
      border-radius: 8px; padding: 14px 16px;
      font-size: 0.85rem; color: var(--error); line-height: 1.5;
    }
  </style>
</head>
<body>

<header>
  <h1>📡 GeoTIFF Viewer</h1>
  <p>Загрузите геопривязанный файл GeoTIFF — система создаст интерактивную веб-карту.</p>
</header>

<div class="card">

  <div id="drop-zone">
    <input type="file" id="file-input" accept=".tif,.tiff">
    <div class="icon">🗺️</div>
    <div class="label">Перетащите файл сюда или нажмите для выбора</div>
    <div class="hint">Поддерживается: GeoTIFF (.tif, .tiff) · до 500 МБ</div>
  </div>
  <div id="file-name"></div>
  <button id="submit-btn" disabled>Загрузить и обработать</button>

  <!-- Спиннер во время обработки -->
  <div id="spinner">
    <div class="spin"></div>
    <p>Файл обрабатывается, пожалуйста подождите…</p>
  </div>

  <!-- Ошибка -->
  <div id="error-box"></div>

</div>

<script>
  var selectedFile = null;

  var dropZone  = document.getElementById('drop-zone');
  var fileInput = document.getElementById('file-input');
  var fileNameEl = document.getElementById('file-name');
  var submitBtn = document.getElementById('submit-btn');
  var spinner   = document.getElementById('spinner');
  var errorBox  = document.getElementById('error-box');

  // Drag & Drop
  dropZone.addEventListener('dragover', function(e) {
    e.preventDefault(); dropZone.classList.add('hover');
  });
  dropZone.addEventListener('dragleave', function() {
    dropZone.classList.remove('hover');
  });
  dropZone.addEventListener('drop', function(e) {
    e.preventDefault(); dropZone.classList.remove('hover');
    var f = e.dataTransfer.files[0];
    if (f) setFile(f);
  });
  fileInput.addEventListener('change', function() {
    if (fileInput.files[0]) setFile(fileInput.files[0]);
  });

  function setFile(f) {
    selectedFile = f;
    fileNameEl.textContent = 'Выбран файл: ' + f.name +
      ' (' + (f.size / 1024 / 1024).toFixed(1) + ' МБ)';
    submitBtn.disabled = false;
    errorBox.style.display = 'none';
  }

  // Отправка
  submitBtn.addEventListener('click', function() {
    if (!selectedFile) return;

    // Показываем спиннер, блокируем кнопку
    submitBtn.disabled = true;
    spinner.style.display = 'block';
    errorBox.style.display = 'none';

    var formData = new FormData();
    formData.append('file', selectedFile);

    fetch('/upload', { method: 'POST', body: formData })
      .then(function(resp) {
        if (resp.ok) {
          // Сервер вернул HTML карты — открываем его вместо текущей страницы
          return resp.text().then(function(html) {
            document.open();
            document.write(html);
            document.close();
          });
        } else {
          // Читаем текст ошибки из JSON
          return resp.json().then(function(data) {
            showError(data.detail || ('Ошибка сервера: ' + resp.status));
          });
        }
      })
      .catch(function(err) {
        showError('Не удалось связаться с сервером: ' + err.message);
      });
  });

  function showError(msg) {
    spinner.style.display = 'none';
    submitBtn.disabled = false;
    errorBox.style.display = 'block';
    errorBox.textContent = '⚠️ ' + msg;
  }
</script>
</body>
</html>
